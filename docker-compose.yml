x-pincer-base: &pincer-base
  restart: unless-stopped
  build:
    context: .
    target: runtime
  working_dir: /app/data
  env_file:
    - path: .env
      required: false
  environment:
    - PINCER_DATA_DIR=/app/data
    - PINCER_DASHBOARD_HOST=0.0.0.0
    - PINCER_DASHBOARD_PORT=8080
    - PINCER_DASHBOARD_DIST=/app/dashboard/dist
    # MCP server — expose Pincer tools to Claude Desktop, Cursor, and other MCP clients
    - PINCER_MCP_SERVER_EXPORT_ENABLED=true
    - PINCER_MCP_SERVER_EXPORT_HOST=0.0.0.0
    - PINCER_MCP_SERVER_EXPORT_PORT=18800
  volumes:
    - pincer-data:/app/data
    - ./skills:/app/skills:ro
    # Optional: mount pincer.toml to configure MCP client servers
    - ./pincer.toml:/app/pincer.toml:ro
  ports:
    - "${PINCER_PORT:-8080}:8080"
    # MCP endpoint for Claude Desktop, Cursor, VS Code, etc.
    - "${PINCER_MCP_PORT:-18800}:18800"
  healthcheck:
    test: ["CMD", "curl", "-f", "http://localhost:8080/api/health"]
    interval: 30s
    timeout: 10s
    retries: 3
    start_period: 15s
  deploy:
    resources:
      limits:
        # Increased from 512M — Node.js MCP subprocess each use ~150-250MB
        memory: 1G
        cpus: "1.5"
  logging:
    driver: json-file
    options:
      max-size: "10m"
      max-file: "3"

services:
  newsapi-mcp:
    extends:
      file: ./mcp_servers/pincer-mcps/docker-compose.yml
      service: newsapi-mcp
    image: pincer/newsapi-mcp:latest
    profiles:
      - http
    environment:
      API_KEY: ${PINCER_NEWSAPI_KEY:-}

  openweathermap-mcp:
    extends:
      file: ./mcp_servers/pincer-mcps/docker-compose.yml
      service: openweathermap-mcp
    image: pincer/openweathermap-mcp:latest
    profiles:
      - http
    environment:
      API_KEY: ${PINCER_OPENWEATHERMAP_API_KEY:-}

  pomodoro-mcp:
    extends:
      file: ./mcp_servers/pomodoro-mcp/docker-compose.yml
      service: pomodoro-mcp
    image: pincer/pomodoro-mcp:latest
    profiles:
      - http

  stock-price-mcp:
    extends:
      file: ./mcp_servers/pincer-mcps/docker-compose.yml
      service: stock-price-mcp
    image: pincer/stock-price-mcp:latest
    profiles:
      - http

  summarize-mcp:
    extends:
      file: ./mcp_servers/pincer-mcps/docker-compose.yml
      service: summarize-mcp
    image: pincer/summarize-mcp:latest
    profiles:
      - http

  translate-mcp:
    extends:
      file: ./mcp_servers/pincer-mcps/docker-compose.yml
      service: translate-mcp
    image: pincer/translate-mcp:latest
    profiles:
      - http

  memory-mcp:
    extends:
      file: ./mcp_servers/memory-mcp/tools/docker/docker-compose.http.yml
      service: mcp-memory-service
    restart: unless-stopped
    profiles:
      - http
    #env_file: .env
    volumes:
      # Single data directory for all storage
      - memory-data:/app/data
    ports:
      - "8001:8000"
    environment:
      - MCP_ALLOW_ANONYMOUS_ACCESS=true
      # Storage configuration
      - MCP_MEMORY_STORAGE_BACKEND=sqlite_vec
      - MCP_MEMORY_SQLITE_PATH=/app/data/mem_sqlite_vec.db
      - MCP_MEMORY_BACKUPS_PATH=/app/data/mem_backups
      # Performance tuning
      - SIMILARITY_THRESHOLD=0.75

  pincer-stdio:
    <<: *pincer-base
    container_name: pincer
    profiles:
      - stdio
    env_file:
      - path: .env
        required: false
      - path: ../.env
        required: false

  pincer-http:
    <<: *pincer-base
    image: pincer/pincer:latest
    profiles:
      - http
    env_file: .env
    volumes:
      - pincer-data:/app/data
      - ./pincer/src:/app/src/pincer/src
      - ./pincer.local.toml:/app/data/pincer.toml:ro
    environment:
      - PINCER_DATA_DIR=/app/data
      - PINCER_DASHBOARD_HOST=0.0.0.0
      - PINCER_DASHBOARD_PORT=8080
      - PINCER_DASHBOARD_DIST=/app/dashboard/dist
    depends_on:
      memory-mcp:
        condition: service_healthy
      newsapi-mcp:
        condition: service_healthy
      openweathermap-mcp:
        condition: service_healthy
      pomodoro-mcp:
        condition: service_healthy
      stock-price-mcp:
        condition: service_healthy
      summarize-mcp:
        condition: service_healthy
      translate-mcp:
        condition: service_healthy

  ngrok:
    image: ngrok/ngrok:latest
    container_name: pincer-ngrok
    profiles:
      - ngrok
    command: ["http", "pincer:8080"]
    environment:
      - NGROK_AUTHTOKEN=${NGROK_AUTHTOKEN}
    depends_on:
      pincer:
        condition: service_healthy
    restart: unless-stopped

volumes:
  pincer-data:
  memory-data:

networks:
  pincer-net:
    name: pincer-net
