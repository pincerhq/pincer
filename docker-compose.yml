x-pincer-base: &pincer-base
  restart: unless-stopped
  image: pincer/pincer:latest
  build:
    context: .
    target: runtime
  env_file:
    - path: .env
      required: false
  environment:
    - PINCER_DATA_DIR=/app/data
    - PINCER_SRC_DIR=/app
    - PINCER_DASHBOARD_HOST=0.0.0.0
    - PINCER_DASHBOARD_PORT=8080
    - PINCER_DASHBOARD_DIST=/app/dashboard/dist
    # MCP server — expose Pincer tools to Claude Desktop, Cursor, and other MCP clients
    - PINCER_MCP_SERVER_EXPORT_ENABLED=true
    - PINCER_MCP_SERVER_EXPORT_HOST=0.0.0.0
    - PINCER_MCP_SERVER_EXPORT_PORT=18800
    - PINCER_TELEMETRY_DSN=${OTEL_DSN}
  volumes:
    - pincer-data:/app/data
    # Optional: mount pincer.toml to configure MCP client servers
    - ./pincer.toml:/app/data/pincer.toml:ro
  healthcheck:
    test: ["CMD", "curl", "-f", "http://localhost:8080/api/health"]
    interval: 30s
    timeout: 10s
    retries: 3
    start_period: 15s
  logging:
    driver: json-file
    options:
      max-size: "10m"
      max-file: "3"

services:
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    profiles:
      - http
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  newsapi-mcp:
    extends:
      file: ./src/pincer-mcps/docker-compose.yml
      service: newsapi-mcp
    image: pincer/newsapi-mcp:latest
    profiles:
      - http
    environment:
      API_KEY: ${PINCER_NEWSAPI_KEY:-}

  openweathermap-mcp:
    extends:
      file: ./src/pincer-mcps/docker-compose.yml
      service: openweathermap-mcp
    image: pincer/openweathermap-mcp:latest
    profiles:
      - http
    environment:
      API_KEY: ${PINCER_OPENWEATHERMAP_API_KEY:-}

  pomodoro-mcp:
    user: "0:0"
    extends:
      file: ./src/pomodoro-mcp/docker-compose.yml
      service: pomodoro-mcp
    image: pincer/pomodoro-mcp:latest
    profiles:
      - http

  stock-price-mcp:
    extends:
      file: ./src/pincer-mcps/docker-compose.yml
      service: stock-price-mcp
    image: pincer/stock-price-mcp:latest
    profiles:
      - http

  summarize-mcp:
    extends:
      file: ./src/pincer-mcps/docker-compose.yml
      service: summarize-mcp
    image: pincer/summarize-mcp:latest
    profiles:
      - http

  translate-mcp:
    extends:
      file: ./src/pincer-mcps/docker-compose.yml
      service: translate-mcp
    image: pincer/translate-mcp:latest
    profiles:
      - http

  memory-mcp:
    extends:
      file: ./src/sqlite-vec-memory-mcp/docker-compose.yml
      service: sqlite-vec-memory-mcp
    image: pincer/memory-mcp:latest
    profiles:
      - http

  ms365-mcp:
    extends:
      file: ./src/ms365-mcp/docker-compose.yml
      service: ms365-mcp
    image: pincer/ms365-mcp:latest
    # Opt-in profile: the server exits at boot without MS365_CLIENT_ID, so it
    # must not be part of `--profile http` or it blocks the whole stack.
    # Enable with: docker compose --profile http --profile ms365 up
    profiles:
      - ms365
    environment:
      MS365_CLIENT_ID: "${PINCER_MS365_CLIENT_ID}"
      MS365_TENANT_ID: "${PINCER_MS365_TENANT_ID:-common}"
      MS365_TOKEN_CACHE_DIR: "/app/data"
      MS365_TOKEN_ENCRYPTION_KEY: "${PINCER_MS365_TOKEN_ENCRYPTION_KEY}"

  doctr-mcp:
    extends:
      file: ./src/doctr-mcp/docker-compose.yml
      service: doctr-mcp
    image: pincer/doctr-mcp:latest
    profiles:
      - http

  pincer-stdio:
    <<: *pincer-base
    container_name: pincer
    profiles:
      - stdio
    ports:
      - "${PINCER_PORT:-8080}:8080"
      # MCP endpoint for Claude Desktop, Cursor, VS Code, etc.
      - "${PINCER_MCP_PORT:-18800}:18800"
    deploy:
      resources:
        limits:
          # Increased from 512M — Node.js MCP subprocess each use ~150-250MB
          memory: 2G
          cpus: "2"

  pincer-http:
    <<: *pincer-base
    container_name: pincer
    profiles:
      - http
    # NOTE: environment is duplicated from x-pincer-base (not appended) — YAML
    # merge keys (<<:) replace inherited list keys wholesale rather than merging
    # them. PINCER_TASK_BROKER=redis must NOT be added to x-pincer-base itself,
    # since pincer-stdio (profile: stdio) also inherits from it and has no redis.
    environment:
      - PINCER_DATA_DIR=/app/data
      - PINCER_DASHBOARD_HOST=0.0.0.0
      - PINCER_DASHBOARD_PORT=8080
      - PINCER_DASHBOARD_DIST=/app/dashboard/dist
      # MCP server — expose Pincer tools to Claude Desktop, Cursor, and other MCP clients
      - PINCER_MCP_SERVER_EXPORT_ENABLED=true
      - PINCER_MCP_SERVER_EXPORT_HOST=0.0.0.0
      - PINCER_MCP_SERVER_EXPORT_PORT=18800
      - PINCER_TELEMETRY_DSN=${OTEL_DSN}
      - PINCER_TASK_BROKER=redis
      - PINCER_TASK_BROKER_URL=redis://redis:6379/0
    env_file: .env
    deploy:
      resources:
        limits:
          memory: 3G
          cpus: "2"
    volumes:
      - pincer-data:/app/data
      # - ./skills:app/skils # uncomment if you want continue to work with user defined skills in anthropic format
      # - ./pincer.local.toml:/app/pincer.local.toml:ro - uncomment this line if you want to override default pincer config
    ports:
      - "${PINCER_PORT:-8080}:8080"
      # MCP endpoint for Claude Desktop, Cursor, VS Code, etc.
      - "${PINCER_MCP_PORT:-18800}:18800"
    depends_on:
      redis:
        condition: service_healthy
      newsapi-mcp:
        condition: service_healthy
      openweathermap-mcp:
        condition: service_healthy
      pomodoro-mcp:
        condition: service_healthy
      stock-price-mcp:
        condition: service_healthy
      summarize-mcp:
        condition: service_healthy
      translate-mcp:
        condition: service_healthy
      doctr-mcp:
        condition: service_healthy
      # memory-mcp intentionally disabled to reduce memory usage
      # ms365-mcp intentionally omitted — it lives in the opt-in `ms365`
      # profile; a depends_on here would pull it in and block startup.

  pincer-http-tasks:
    <<: *pincer-base
    container_name: pincer-tasks-worker
    command: ["pincer", "run", "tasks"]
    profiles:
      - http
    # NOTE: environment is duplicated from x-pincer-base (not appended) — YAML
    # merge keys (<<:) replace inherited list keys wholesale rather than merging
    # them. `pincer run tasks` refuses to start unless PINCER_TASK_BROKER=redis
    # (the in-memory broker can't be shared across processes), so this must be
    # set here explicitly rather than relying on x-pincer-base, which pincer-stdio
    # (profile: stdio, no redis) also inherits from.
    environment:
      - PINCER_DATA_DIR=/app/data
      - PINCER_DASHBOARD_HOST=0.0.0.0
      - PINCER_DASHBOARD_PORT=8080
      - PINCER_DASHBOARD_DIST=/app/dashboard/dist
      # MCP server — expose Pincer tools to Claude Desktop, Cursor, and other MCP clients
      - PINCER_MCP_SERVER_EXPORT_ENABLED=true
      - PINCER_MCP_SERVER_EXPORT_HOST=0.0.0.0
      - PINCER_MCP_SERVER_EXPORT_PORT=18800
      - PINCER_TELEMETRY_DSN=${OTEL_DSN}
      - PINCER_TASK_BROKER=redis
      - PINCER_TASK_BROKER_URL=redis://redis:6379/0
    env_file: .env
    volumes:
      - pincer-data:/app/data
      # - ./skills:app/skils # uncomment if you want continue to work with skills instead of MCP
      # - ./pincer.local.toml:/app/pincer.local.toml:ro - uncomment this line if you want to override default pincer config
    depends_on:
      redis:
        condition: service_healthy
      newsapi-mcp:
        condition: service_healthy
      openweathermap-mcp:
        condition: service_healthy
      pomodoro-mcp:
        condition: service_healthy
      stock-price-mcp:
        condition: service_healthy
      summarize-mcp:
        condition: service_healthy
      translate-mcp:
        condition: service_healthy
      doctr-mcp:
        condition: service_healthy
      # memory-mcp intentionally disabled to reduce memory usage
      # ms365-mcp intentionally omitted — it lives in the opt-in `ms365`
      # profile; a depends_on here would pull it in and block startup.

volumes:
  pincer-data:
  memory-data:
  model-cache:
  ms365-data:
  doctr-model-cache:
  redis-data:

networks:
  pincer-net:
    name: pincer-net
