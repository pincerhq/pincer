services:
  - type: web
    name: pincer
    runtime: docker
    dockerfilePath: ./Dockerfile
    healthCheckPath: /api/health
    envVars:
      - key: PINCER_ANTHROPIC_API_KEY
        sync: false
      - key: PINCER_TELEGRAM_BOT_TOKEN
        sync: false
      # Signs dashboard session tokens. Sign-in itself is per identity: after the
      # first deploy run `pincer identity create <name>` and
      # `pincer identity set-password <name>` in the service shell.
      - key: PINCER_JWT_SECRET
        generateValue: true
    disk:
      name: pincer-data
      mountPath: /app/data
      sizeGB: 1
