[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "pomodoro-mcp"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115.12",
    # See src/ms365-mcp/pyproject.toml's comment: fastmcp 3.4.2's PyPI
    # packaging is broken (empty `fastmcp/__init__.py`, `FastMCP` unimportable).
    "fastmcp==3.2.4",
    "pydantic>=2.4.1,<2.13",
    "uvicorn>=0.34.0",
]

[project.optional-dependencies]
telemetry = [
    "pincer-telemetry @ git+https://github.com/pincerhq/pincer-telemetry.git@main"
]

[project.scripts]
pomodoro_server = "pomodoro_server:main"

[tool.hatch.metadata]
allow-direct-references = true

[tool.hatch.build.targets.wheel]
packages = ["."]
