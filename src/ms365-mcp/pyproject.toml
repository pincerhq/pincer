[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ms365-mcp"
version = "0.8.0"
requires-python = ">=3.12"
dependencies = [
    "msal>=1.28.0",
    "cryptography>=42",
    # Pinned exactly: fastmcp 3.4.2 restructured its PyPI packaging into a thin
    # wrapper around a separate `fastmcp-slim` distribution, and that install
    # ends up without a usable `fastmcp/__init__.py` (`Context`, `FastMCP`,
    # `exceptions` all fail to import) — a real breakage, not a local fluke.
    # 3.2.4 is the version this whole server was built and tested against;
    # widen this only after verifying a newer release imports cleanly.
    "fastmcp==3.2.4",
    "mcp>=1.24.0",
    "httpx>=0.27.0",
    "pydantic-settings>=2.0.0",
    "starlette>=0.41.0",
    "uvicorn[standard]>=0.35.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=6.0.0",
]

[project.scripts]
ms365-mcp-run = "ms365.ms365_server:main"
ms365-mcp-setup  = "ms365.setup_cli:main"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["."]

[tool.hatch.build.targets.wheel]
packages = ["ms365"]

[dependency-groups]
dev = [
    "pytest>=9.0.3",
    "pytest-asyncio>=1.3.0",
    "pytest-cov>=7.1.0",
]
