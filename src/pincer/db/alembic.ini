[alembic]
# %(here)s resolves relative to this ini file (Alembic >= 1.13), so this
# works regardless of the invoking process's cwd, e.g.:
#   uv run alembic -c src/pincer/db/alembic.ini current
script_location = %(here)s/migrations
prepend_sys_path = .

# No sqlalchemy.url here on purpose: env.py resolves it from
# PINCER_DATABASE_URL / the app's configured settings.db_path when not set
# programmatically by pincer.db.engine.ensure_schema_current().

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
