[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "pincer-mcps"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115.12",
    # See src/ms365-mcp/pyproject.toml's comment: fastmcp 3.4.2's PyPI
    # packaging is broken (empty `fastmcp/__init__.py`, `FastMCP` unimportable).
    "fastmcp==3.2.4",
    "httpx>=0.28.1",
    "pydantic>=2.4.1,<2.13",
    "youtube-transcript-api>=0.6.3",
]

[project.optional-dependencies]
telemetry = [
    "pincer-telemetry @ git+https://github.com/pincerhq/pincer-telemetry.git@main"
]

[project.scripts]
newsapi_server = "newsapi_server:main"
openweathermap_server = "openweathermap_server:main"
stock_price_server = "stock_price_server:main"
summarize_server = "summarize_server:main"
translate_server = "translate_server:main"

[tool.hatch.metadata]
allow-direct-references = true

[tool.hatch.build.targets.wheel]
packages = ["."]
