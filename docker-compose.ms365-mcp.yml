# Microsoft 365 MCP server.
#
# Reuses the root image (which already installs the `mcp` + `msal` extras and
# the `pincer-ms365-mcp` entry point) and runs it over streamable HTTP.
#
# Prerequisites:
#   1. Authenticate once on the host (interactive device-code flow):
#        pincer setup-ms365
#      This writes ~/.pincer/ms365_token_cache.json, mounted below.
#   2. Provide the Azure app credentials (env or a .env file beside this compose).
#
# Run (UID/GID make the mounted token readable/writable from inside the container):
#   UID=$(id -u) GID=$(id -g) docker compose -f docker-compose.ms365-mcp.yml up --build
#   MCP endpoint → http://localhost:18820/mcp

services:
  ms365-mcp:
    build:
      context: .
      dockerfile: Dockerfile
      target: runtime
    image: pincer:latest
    restart: unless-stopped
    # Run as the host user so the bind-mounted token cache is readable and
    # MSAL can write refreshed tokens back to it.
    user: "${UID:-1000}:${GID:-1000}"
    command:
      - pincer-ms365-mcp
      - --transport
      - http
      - --host
      - "0.0.0.0"
      - --port
      - "18820"
    environment:
      # Path.home() resolves from HOME; the token cache lives under $HOME/.pincer.
      HOME: /home/app
      PINCER_MS365_CLIENT_ID: ${PINCER_MS365_CLIENT_ID:?set PINCER_MS365_CLIENT_ID}
      PINCER_MS365_TENANT_ID: ${PINCER_MS365_TENANT_ID:-common}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
    ports:
      - "18820:18820"
    volumes:
      # Mount the host's ~/.pincer (owned by the host user → read-write).
      - ${HOME}/.pincer:/home/app/.pincer
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:18820/health"]
      interval: 30s
      timeout: 10s
      start_period: 15s
      retries: 3
