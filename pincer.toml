# [[mcp.servers]]
# name      = "summarize"
# transport = "streamable-http"
# url       = "http://summarize-mcp:8000/mcp"

# [[mcp.servers]]
# name      = "translate"
# transport = "streamable-http"
# url       = "http://translate-mcp:8000/mcp"

# [[mcp.servers]]
# name      = "websearch"
# transport = "streamable-http"
# url       = "http://websearch-mcp:8000/mcp"

# [[mcp.servers]]
# name      = "doctr"
# transport = "streamable-http"
# url       = "http://doctr-mcp:8000/mcp"
# timeout   = 120  # CPU-bound OCR inference is slower than a quick API call or embedding lookup

# In app runtime servers using stdio protocol for fast startup (default)
[[mcp.servers]]
name = "sqlite_vec_memory"
transport = "stdio"
command = "python"
args = ["${PINCER_SRC_DIR:-$PWD}/src/sqlite-vec-memory-mcp/memory_server.py"]
env = { MEMORY_DB_PATH = "${PINCER_DATA_DIR}/sqlite_vec.db", FASTEMBED__CACHE_DIR = "${PINCER_DATA_DIR}/fastembed_cache" }
sandbox = true
approval_required = ["*"]

[[mcp.servers]]
name      = "newsapi"
transport = "stdio"
command = "python"
args = ["${PINCER_SRC_DIR:-$PWD}/src/pincer-mcps/newsapi_server.py"]
env = { API_KEY="${PINCER_NEWSAPI_KEY}" }
approval_required = ["*"]

[[mcp.servers]]
name      = "openweathermap"
transport = "stdio"
command = "python"
args = ["${PINCER_SRC_DIR:-$PWD}/src/pincer-mcps/openweathermap_server.py"]
env = { API_KEY="${PINCER_OPENWEATHERMAP_API_KEY}" }
approval_required = ["*"]

[[mcp.servers]]
name      = "pomodoro"
transport = "stdio"
command = "python"
args = ["${PINCER_SRC_DIR:-$PWD}/src/pomodoro-mcp/pomodoro_server.py"]

[[mcp.servers]]
name      = "stock_price"
transport = "stdio"
command = "python"
args = ["${PINCER_SRC_DIR:-$PWD}/src/pincer-mcps/stock_price_server.py"]

[[mcp.servers]]
name      = "summarize"
transport = "stdio"
command = "python"
args = ["${PINCER_SRC_DIR:-$PWD}/src/pincer-mcps/summarize_server.py"]

[[mcp.servers]]
name      = "translate"
transport = "stdio"
command = "python"
args = ["${PINCER_SRC_DIR:-$PWD}/src/pincer-mcps/translate_server.py"]

[[mcp.servers]]
name      = "websearch"
transport = "stdio"
command = "python"
args = ["${PINCER_SRC_DIR:-$PWD}/src/pincer-mcps/websearch_server.py"]
env = { API_KEY="${PINCER_TAVILY_API_KEY}" }
approval_required = ["*"]

[[mcp.servers]]
name      = "ms365"
transport = "stdio"
command = "python"
args = ["${PINCER_SRC_DIR:-$PWD}/src/ms365-mcp/ms365/ms365_server.py"]
env = { MS365_CLIENT_ID="${PINCER_MS365_CLIENT_ID}", MS365_CLIENT_SECRET="${PINCER_MS365_CLIENT_SECRET}", MS365_TENANT_ID="${PINCER_MS365_TENANT_ID}", MS365_TOKEN_CACHE_DIR="${HOME}/.pincer/ms365_mcp", MS365_TOKEN_ENCRYPTION_KEY="${PINCER_MS365_TOKEN_ENCRYPTION_KEY}" }
approval_required = ["*"]
# On first run (no cached token yet) the server blocks on the device-code auth
# flow before it can speak the MCP protocol — give the user time to sign in.
# Subsequent runs reuse the cached token and connect in well under a second.
startup_timeout = 600

[[mcp.servers]]
name      = "doctr"
transport = "stdio"
command = "python"
args = ["${PINCER_SRC_DIR:-$PWD}/src/doctr-mcp/doctr_mcp/server.py", "--transport", "stdio"]
env = { DOCTR_DEVICE = "cpu", DOCTR_CACHE_DIR = "${PINCER_DATA_DIR}/doctr_cache" }
sandbox = true
approval_required = ["*"]
# Predictor construction and model download are lazy (only on first tool call, not
# at startup), so the default startup_timeout is fine — but per-call inference on
# CPU is slower than this repo's other bundled servers, hence the longer timeout.
timeout = 120
