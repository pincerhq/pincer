# IMPORTANT: http transport can't manage command and args at the moment.
# It means there is not possible to run server in http mode via command locally
# and connect to it via url. http transport useful for containers inside local
# docker or for completely remote mcp servers

# Dockerized servers for safe long term run
# [[mcp.servers]]
# name      = "memory"
# transport = "streamable-http"
# url       = "http://memory-mcp:8000/mcp"

# [[mcp.servers]]
# name      = "newsapi"
