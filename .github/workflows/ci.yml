# .github/workflows/ci.yml
name: CI
on: [push, pull_request]
jobs:
  pincer:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v4
      - run: uv sync --all-extras

      - name: Run tests with coverage
        run: uv run pytest --cov=pincer --cov-report=xml tests/

      - name: Run ms365-mcp tests
        run: uv run pytest src/ms365-mcp/tests

      - name: Run doctr-mcp tests
        run: uv run pytest src/doctr-mcp/tests

      - name: Type check
        run: uv run mypy src/ --exclude '(ms365-mcp|doctr-mcp)'

      - name: Type check ms365-mcp tests
        run: uv run mypy src/ms365-mcp

      - name: Type check doctr-mcp tests
        run: uv run mypy src/doctr-mcp

      - name: Lint
        run: uv run ruff check .

      - name: Format check
        run: uv run ruff format --check .

      - name: Security scan
        run: uv run bandit -r src/pincer -ll -s B101,B104,B310,B608

      - name: Upload coverage reports to Codecov
        uses: codecov/codecov-action@v5
        if: always()
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: false

  dashboard:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: dashboard
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
          cache-dependency-path: dashboard/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile

      - name: Type check
        run: pnpm type-check

      - name: Lint
        run: pnpm lint

      - name: Test
        run: pnpm test
